name: Update and Publish SDK

on:
  repository_dispatch:
    types: [update-sdk]
  workflow_dispatch:

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Check whether npm already has the API version
        id: compare
        run: |
          NEW_VERSION=$(curl -fsS https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json | jq -r '.info.version')
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          if [ -n "$(npm view "linkbreakers@$NEW_VERSION" version 2>/dev/null)" ]; then
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "npm already has $NEW_VERSION"
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "npm does not have $NEW_VERSION yet"
          fi

      - name: Generate SDK
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          npm install -g @openapitools/openapi-generator-cli
          curl -fsS https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json \
            | jq '.openapi = "3.1.0" | del(.jsonSchemaDialect)' > openapi-3.1.json

          rm -rf src
          openapi-generator-cli generate \
            -i openapi-3.1.json \
            -g typescript-fetch \
            -o . \
            -c openapi-config.yaml \
            -t templates \
            --skip-validate-spec \
            --git-host github.com \
            --git-user-id linkbreakers-com \
            --git-repo-id linkbreakers-typescript \
            --global-property apiDocs=false,modelDocs=false \
            --additional-properties=npmVersion=$NEW_VERSION

          echo "$NEW_VERSION" > OPENAPI_VERSION
          rm openapi-3.1.json

      - name: Build
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Smoke check the packed package
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          npm run check:docs
          SMOKE=$(mktemp -d)
          npm pack --silent --pack-destination "$SMOKE"
          cd "$SMOKE"
          npm init -y >/dev/null
          npm install --no-audit --no-fund ./linkbreakers-*.tgz
          node -e "
          const lb = require('linkbreakers');
          const api = new lb.LinksApi(new lb.Configuration({ accessToken: 'smoke' }));
          if (typeof api.linksServiceList !== 'function') throw new Error('LinksApi is missing linksServiceList');
          "

      - name: Publish to npm
        if: steps.compare.outputs.needs_update == 'true'
        run: npm publish --provenance --access public

      - name: Commit, tag and push
        if: steps.compare.outputs.needs_update == 'true'
        env:
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "chore: update SDK to API version $NEW_VERSION"
          fi
          git push origin main
          if ! git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" >/dev/null; then
            git tag "v$NEW_VERSION"
            git push origin "v$NEW_VERSION"
          fi

      - name: Close release failure issues
        if: success() && steps.compare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.compare.outputs.new_version }}
        run: |
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Published $NEW_VERSION."
          done

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW_VERSION: ${{ steps.compare.outputs.new_version || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MESSAGE="Publishing linkbreakers $NEW_VERSION to npm failed. Run: $RUN_URL"
          echo "::error title=Release failed::$MESSAGE"
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The update and publish workflow failed" --force
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label release-failure \
              --title "SDK release failing" --body "$MESSAGE"
          fi
